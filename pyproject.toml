[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronsplain"
version = "1.0.0"
description = "Explain cron schedule expressions in plain English or JSON."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cron", "cli", "schedule"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
cronsplain = "cronsplain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
